# The FSM in data. Repo-agnostic by construction: capability SLOTS only —
# concrete commands live in each repo's profile.yml (enforced by the
# agnostic-lint test). Adding a stage or tightening a gate is a YAML edit;
# the engine skill and CLI never change.

stages:
  CONTEXT:
    prompt: stages/context.md
    output: artifacts/01-context.md
    validate:
      - artifact_complete: artifacts/01-context.md
      - sections: [Requirements, Acceptance criteria, Decisions, Findings, Open questions]
      - ac_population   # every criterion names the population it is about — the question that separates a shipped fix from a fix to the writer only
    gate: { required: true }
    next: PLAN

  PLAN:
    prompt: stages/plan.md
    inputs: [artifacts/01-context.md]
    output: artifacts/02-plan.md
    critic: { agent: pipeline-critic, prompt: stages/plan-critic.md, max_rounds: 2 }
    validate:
      - artifact_complete: artifacts/02-plan.md
      - sections: [Approach, Affected files, Coupling, Risks, Subtasks, Testing strategy, Open questions]
      - files_exist_in_repo: Affected files
      - evidence_verified: Coupling   # the gate re-runs each row's search and compares the hit count — a claim that cannot survive its own command is not evidence
      - subtask_coupling
    gate: { required: true }
    next: BREAKDOWN

  BREAKDOWN:
    prompt: stages/breakdown.md
    inputs: [artifacts/02-plan.md]
    output: artifacts/03-progress.md
    validate:
      - artifact_complete: artifacts/03-progress.md
      - sections: [Subtasks, Deviations]
      - substate_set: [subtask, of]
      - subtask_coupling   # re-checked: a plan amendment between gates must not smuggle a coupling split past BREAKDOWN
    gate: { required: true }
    next: IMPLEMENT

  IMPLEMENT:
    prompt: stages/implement.md
    per_subtask: true
    validate:
      - profile_command: lint_changed
      - profile_command: test_targeted
      - profile_command: post_change_hooks
      - git_clean_within
      - no_secrets
    gate: { required: true }
    next: TEST

  TEST:
    prompt: stages/test.md
    inputs: [artifacts/02-plan.md, artifacts/03-progress.md]
    output: artifacts/04-test-report.md
    validate:
      - artifact_complete: artifacts/04-test-report.md
      - sections: [Coverage audit, Risk-to-test map, Added tests, Deferred]
      - ac_traceability
      - ac_proofs   # each criterion's test was WATCHED to fail without the fix, and the ledger expires when the code under test changes
      - profile_command: lint_changed
      - profile_command: test_targeted
    gate: { required: true }
    next: REVIEW

  REVIEW:
    # The plan is a PASS-B input only. Pass A reviews the diff blind — handing
    # the reviewer the implementer's plan hands it the implementer's blind spots
    # with it, and the whole value of a second pair of eyes is that they did not
    # already decide which shortcuts were reasonable.
    prompt: stages/review.md
    inputs: [artifacts/02-plan.md]
    output: artifacts/05-review.md
    critic: { agent: pipeline-reviewer, max_rounds: 2 }
    validate:
      - artifact_complete: artifacts/05-review.md
      - sections: [Blind pass, Findings, Coupling, Fixes applied, Disputed, Plan-vs-shipped check]
      - evidence_verified: Coupling   # re-checked at REVIEW: the fix loop moves code, and a coupling row proved at PLAN may no longer hold
      - review_counts
      - profile_command: lint_changed
      - profile_command: test_targeted
      - no_secrets   # re-scan the full branch: review-loop fixes can add lines after the last subtask gate
    gate: { required: true }
    next: PR

  PR:
    prompt: stages/pr.md
    inputs: [artifacts/02-plan.md, artifacts/03-progress.md, artifacts/04-test-report.md, artifacts/05-review.md]
    output: artifacts/06-pr-draft.md
    validate:
      - artifact_complete: artifacts/06-pr-draft.md
      - sections: [Title, Description, Testing notes, Ops notes, Reviewer guidance]
    gate: { required: true, human_required: true }   # push is irreversible → human even in express mode; approving unlocks push in the guard
    next: CI

  CI:
    prompt: stages/ci.md
    output: artifacts/07-ci-analysis.md
    validate:
      - artifact_complete: artifacts/07-ci-analysis.md
      - sections: [Runs analyzed, Classification, Fixes, Outcome]
    gate: { required: true, human_required: true }   # CI fixes get pushed → human even in express mode
    next: SCRIBE

  SCRIBE:
    prompt: stages/scribe.md
    output: artifacts/08-retro.md
    validate:
      - artifact_complete: artifacts/08-retro.md
      - sections: [Plan-vs-shipped, Learnings, Routing]
    gate: { required: true }
    next: DONE
